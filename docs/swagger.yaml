  /templates/{id}/versions/{versionId}/discard:
    post:
      description: 'Gives up a draft: it stays in the history, readable and restorable,
        but it is nobody''s draft in progress any more — it leaves the template''s
        drafts, and the next save starts from the published version — and it is never
        published. Any operator with the write role can discard any draft. Discarding
        a discarded draft changes nothing and answers the same way. Answers with the
        version as discarding left it.'
      parameters:
      - description: Template ID
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: Version ID of the draft
        in: path
        name: versionId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.TemplateVersion'
          description: OK
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apperrors.AppError'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apperrors.AppError'
          description: 'Not Found: no such template or version, or the template is
            archived'
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apperrors.AppError'
          description: 'template.not_a_draft: the version is published'
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apperrors.AppError'
          description: Internal Server Error
      summary: Discard a draft
      tags:
      - Templates
  /templates/{id}/versions/{versionId}/publish:
    post:
      description: |-
        Makes a draft the version the template sends: the draft is marked published and copied onto the template row — name, subject, HTML and plain text, and react_email_content: the JSX source when JSX is the Main source, an empty string otherwise, so the old panel never re-renders a JSX source that is not what is sent — in one transaction. Answers with the template as publishing left it. Publishing the version the template already sends changes nothing and answers the same way. The draft is checked again as it was when saved, against the template's Required variables as they stand at publishing.

        A draft is stale when its base_version_id is not the template's published_version_id: someone published after it was started, and publishing it would quietly revert their version. That is refused with 409 template.stale_base, whose params name version_id (the draft), base_version_id (what it started from) and published_version_id (what is sent now), so both can be shown side by side. The operator's confirmation names the version they saw: {"force": {"over_version_id": <published_version_id from the conflict>}} publishes the draft over it, and the replaced version stays in the history. If another version was published since, the confirmation is refused with a fresh 409 naming it.
      parameters:
      - description: Template ID
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: Version ID of the draft
        in: path
        name: versionId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/requests.PublishTemplateVersion'
                description: The version a stale draft is published over
                summary: publish
        description: The version a stale draft is published over
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.Template'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apperrors.AppError'
          description: validation.error
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apperrors.AppError'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apperrors.AppError'
          description: 'Not Found: no such template or version, or the template is
            archived'
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apperrors.AppError'
          description: template.stale_base, template.not_a_draft or template.draft_discarded
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apperrors.AppError'
          description: 'template.unparseable (params.part: subject, plain_text or
            html), or template.required_variables_missing: the draft drops a Required
            variable the template has now, a variable marked since it was saved included
            (params.missing: [{name, source, reason}])'
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apperrors.AppError'
          description: Internal Server Error
      summary: Publish a draft
      tags:
      - Templates
  /templates/{id}/versions/{versionId}/restore:
    post:
      description: Copies any version of the template — its subject, sources, Main
        source and render — into a new draft by the caller, started from the version
        published now. Nothing that is sent changes; the draft is published like any
        other. Another operator's draft can be restored too. When the copy would repeat
        the version it continues — the caller's draft in progress on the published
        version, or else the published version — nothing is recorded and that version
        is answered with 200.
      parameters:
      - description: Template ID
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: Version ID
        in: path
        name: versionId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.TemplateVersion'
          description: 'Nothing changed: the version the copy would have repeated'
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.TemplateVersion'
          description: The draft, written
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apperrors.AppError'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apperrors.AppError'
          description: 'Not Found: no such template or version, or the template is
            archived'
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apperrors.AppError'
          description: 'template.unparseable: the copy would not parse; or template.required_variables_missing:
            it drops a Required variable the template has now (params.missing: [{name,
            source, reason}]) — checked as a saved draft is'
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apperrors.AppError'
          description: Internal Server Error
      summary: Restore a version as a draft
      tags:
      - Templates
  /templates/by-key/{key}:
    get:
      description: Get a template by its stable key (for example keycloak.verify-email).
      parameters:
      - description: Template key
        in: path
        name: key
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.Template'
          description: OK
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apperrors.AppError'
          description: Not Found
      summary: Get an email template by key
      tags:
      - Templates
    put:
      description: |-
        The Template seed's path: creates the template when the key is new and replaces its content — the subject included — when it already exists. Un-archives the template so a seed always leaves a usable template behind. Records the content the template ends up with as a Template seed version, published at once; react_email_content holding a JSX source (anything but whitespace and comments, so not the seed's old pointer comment) makes it the version's JSX Main source, and otherwise the HTML content is the HTML Main source. Writes the contract Required variables when sent, and keeps them when not. The subject, plain text and HTML content must parse as Go templates, and the HTML content must reference every Required variable — the contract set it ends up with and the operators' — or nothing is written.

        Neither the seed nor an operator silently overwrites the other (ADR-0047). A template an operator changed since the last seed is refused with 409 template.seed_conflict and nothing is written, when any of these holds (params.rules lists each that does): published_by_operator — the version the template sends is not the last Template seed version; newer_operator_version — an operator wrote a version after the last seed version, a draft included and a discarded draft not; operator_subject — the subject sent is an operator's that the seed would overwrite: neither the one the last seed version asked for nor the one asked for now (for a template whose last seed version is the migration's first one, which does not know what the seed asked for: the seed asks for a subject other than the one sent). The refusal is kept on the template as seed_refusal until a seed goes through. A seed that would leave the template as its published version already is overwrites nothing and is never refused. force=true writes over the operator's change anyway, as a published Template seed version; their versions stay in the history and can be restored.
      parameters:
      - description: Template key
        in: path
        name: key
        required: true
        schema:
          type: string
      - description: Write even over an operator's change since the last seed
        in: query
        name: force
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/requests.UpsertTemplateByKey'
                description: Template details
                summary: template
        description: Template details
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.Template'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apperrors.AppError'
          description: Bad Request (validation.error, force included)
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apperrors.AppError'
          description: 'template.seed_conflict: an operator changed the template since
            the last seed; params: key, template_id, rules, published_version, last_seed_version,
            operator_versions (each {id, seq, author, published_at}), subject (sent
            now) and requested_subject (the seed''s)'
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apperrors.AppError'
          description: The subject, plain text or HTML content does not parse (template.unparseable,
            params.part) or the HTML drops a Required variable (template.required_variables_missing,
            params.missing names each with its set and reason)
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apperrors.AppError'
          description: Internal Server Error
      summary: Create or replace a template addressed by key
      tags:
      - Templates
