components:
  schemas:
    apperrors.AppError:
      properties:
        code:
          type: string
        message:
          type: string
        params:
          additionalProperties: {}
          type: object
      type: object
    database.GetMailQueueItemsByTaskIdRow:
      properties:
        attempts:
          type: integer
        created_at:
          type: string
        error:
          type: string
        id:
          type: string
        next_attempt_at:
          type: string
        recipient_email:
          type: string
        recipient_full_name:
          type: string
        status:
          $ref: '#/components/schemas/database.NullMailQueueStatus'
      type: object
    database.MailQueueStatus:
      enum:
      - pending
      - processing
      - sent
      - failed
      type: string
      x-enum-varnames:
      - MailQueueStatusPending
      - MailQueueStatusProcessing
      - MailQueueStatusSent
      - MailQueueStatusFailed
    database.MailingList:
      properties:
        archived_at:
          type: string
        archived_by:
          type: string
        created_at:
          type: string
        description:
          type: string
        id:
          type: string
        name:
          type: string
        updated_at:
          type: string
      type: object
    database.NullMailQueueStatus:
      properties:
        mail_queue_status:
          $ref: '#/components/schemas/database.MailQueueStatus'
        valid:
          description: Valid is true if MailQueueStatus is not NULL
          type: boolean
      type: object
    database.Recipient:
      properties:
        created_at:
          type: string
        email:
          type: string
        full_name:
          type: string
        id:
          type: string
        updated_at:
          type: string
      type: object
    database.VersionAuthor:
      properties:
        kind:
          description: 'operator: written in SkyMail; template_seed: written by the
            Template seed from the repo.'
          enum:
          - operator
          - template_seed
          type: string
        name:
          description: The name the writer's token carried when the version was written.
            Null when not known.
          type: string
        sub:
          description: 'The Keycloak subject of the token that wrote the version.
            Null when not known: the first versions, made from templates written before
            versions were kept.'
          type: string
      type: object
    handlers.DailySent:
      properties:
        date:
          example: "2026-09-22"
          type: string
        sent:
          type: integer
      type: object
    handlers.MailTaskItem:
      properties:
        audience:
          $ref: '#/components/schemas/handlers.SendAudience'
        body_variables:
          items:
            type: integer
          type: array
          uniqueItems: false
        created_at:
          type: string
        id:
          type: string
        mail_list_id:
          type: string
        mail_list_name:
          type: string
        recipient_counts:
          $ref: '#/components/schemas/handlers.QueueCounts'
        sent_by:
          type: string
        status:
          $ref: '#/components/schemas/handlers.SendStatus'
        template_id:
          type: string
        template_key:
          type: string
        template_name:
          type: string
      type: object
    handlers.MailingListItem:
      properties:
        archived_at:
          type: string
        archived_by:
          type: string
        created_at:
          type: string
        description:
          type: string
        id:
          type: string
        name:
          type: string
        source:
          type: string
        updated_at:
          type: string
      type: object
    handlers.QueueCounts:
      properties:
        failed:
          type: integer
        pending:
          type: integer
        processing:
          type: integer
        sent:
          type: integer
      type: object
    handlers.SendAudience:
      properties:
        kind:
          enum:
          - mailing_list
          - single
          type: string
        mail_list_id:
          type: string
        name:
          type: string
        recipient_email:
          type: string
        recipient_full_name:
          type: string
        source:
          enum:
          - internal
          - keycloak
          type: string
      type: object
    handlers.SendCounts:
      properties:
        failed:
          type: integer
        sending:
          type: integer
        sent:
          type: integer
      type: object
    handlers.SendStatus:
      enum:
      - failed
      - sending
      - sent
      type: string
      x-enum-varnames:
      - SendStatusFailed
      - SendStatusSending
      - SendStatusSent
    handlers.SendSummary:
      properties:
        daily_sent:
          items:
            $ref: '#/components/schemas/handlers.DailySent'
          type: array
          uniqueItems: false
        queue_counts:
          $ref: '#/components/schemas/handlers.QueueCounts'
        recent_sends:
          items:
            $ref: '#/components/schemas/handlers.MailTaskItem'
          type: array
          uniqueItems: false
        send_counts:
          $ref: '#/components/schemas/handlers.SendCounts'
        time_zone:
          example: Europe/Istanbul
          type: string
      type: object
    handlers.Template:
      properties:
        archived_at:
          type: string
        archived_by:
          type: string
        created_at:
          type: string
        drafts:
          description: 'Each operator''s draft in progress, newest first: the newest
            version an operator wrote of the template, while it is unpublished. An
            operator''s earlier drafts are superseded and not listed. A draft whose
            base_version_id is not published_version_id is stale: a newer version
            was published after it was started, and publishing it takes force.'
          items:
            $ref: '#/components/schemas/handlers.TemplateVersionSummary'
          type: array
          uniqueItems: false
        html_content:
          type: string
        id:
          type: string
        key:
          type: string
        main_mode:
          description: 'The Authoring mode of the Main source the template sends:
            its published version''s. Null for a template with no published version.'
          enum:
          - jsx
          - visual
          - html
          type: string
        name:
          type: string
        plain_text_content:
          type: string
        published_version_id:
          type: string
        react_email_content:
          type: string
        subject:
          type: string
        system:
          type: boolean
        updated_at:
          type: string
      type: object
    handlers.TemplateVersion:
      properties:
        author:
          $ref: '#/components/schemas/database.VersionAuthor'
        base_version_id:
          description: The published version a draft started from; null for a template's
            first version.
          type: string
        created_at:
          type: string
        current:
          description: Whether this is the published version the template sends.
          type: boolean
        html_content:
          description: The Main source rendered as HTML, as the browser or the Template
            seed rendered it.
          type: string
        html_source:
          description: The HTML source; null when the version has none.
          type: string
        id:
          type: string
        jsx_source:
          description: The JSX source, React Email code; null when the version has
            none.
          type: string
        main_mode:
          description: 'The Authoring mode whose source is the Main source: its render
            is what the version sends.'
          enum:
          - jsx
          - visual
          - html
          type: string
        plain_text_content:
          description: The Main source rendered as plain text.
          type: string
        published_at:
          description: When the version was published; null for a draft.
          type: string
        requested_subject:
          description: 'The subject the Template seed sent for its version. It can
            differ from subject: until the seed''s conflict rule, the seed keeps the
            subject a template already has. Null on an operator''s version and on
            the first versions, made from templates written before versions were kept.'
          type: string
        seq:
          description: 1, 2, 3… within the template, in the order versions were written.
          type: integer
        subject:
          type: string
        template_id:
          type: string
        visual_source:
          description: The Visual source, the block editor's document; null when the
            version has none.
          type: object
      type: object
    handlers.TemplateVersionSummary:
      properties:
        author:
          $ref: '#/components/schemas/database.VersionAuthor'
        base_version_id:
          description: The published version a draft started from; null for a template's
            first version.
          type: string
        created_at:
          type: string
        current:
          description: Whether this is the published version the template sends.
          type: boolean
        id:
          type: string
        main_mode:
          description: 'The Authoring mode whose source is the Main source: its render
            is what the version sends.'
          enum:
          - jsx
          - visual
          - html
          type: string
        published_at:
          description: When the version was published; null for a draft.
          type: string
        requested_subject:
          description: 'The subject the Template seed sent for its version. It can
            differ from subject: until the seed''s conflict rule, the seed keeps the
            subject a template already has. Null on an operator''s version and on
            the first versions, made from templates written before versions were kept.'
          type: string
        seq:
          description: 1, 2, 3… within the template, in the order versions were written.
          type: integer
        subject:
          type: string
        template_id:
          type: string
      type: object
    requests.AddRecipient:
      properties:
        email:
          type: string
        full_name:
          type: string
      required:
      - email
      - full_name
      type: object
    requests.CreateMailTask:
      properties:
        body_variables:
          additionalProperties: {}
          type: object
        mail_list_id:
          type: string
        template_id:
          type: string
      required:
      - mail_list_id
      - template_id
      type: object
    requests.CreateMailingList:
      properties:
        name:
          type: string
      required:
      - name
      type: object
    requests.CreateTemplate:
      properties:
        html_content:
          type: string
        key:
          type: string
        name:
          type: string
        plain_text_content:
          type: string
        react_email_content:
          type: string
        subject:
          type: string
      required:
      - html_content
      - name
      - plain_text_content
      - react_email_content
      - subject
      type: object
    requests.PublishTemplateVersion:
      properties:
        force:
          description: Publish even though a newer version was published after the
            draft was started, replacing it. The replaced version stays in the history.
          type: boolean
      type: object
    requests.SaveTemplateDraft:
      properties:
        base_version_id:
          description: 'The published version the draft started from: the template''s
            published_version_id when the editor opened it. Null only for a template
            that has no published version.'
          type: string
        html_content:
          description: The Main source rendered as HTML, with its Go template actions
            intact for the mailer to fill per send.
          type: string
        html_source:
          description: 'The HTML source. Left out or null: kept as it is.'
          type: string
        jsx_source:
          description: 'The JSX source, React Email code. Left out or null: kept as
            it is.'
          type: string
        main_mode:
          description: 'The Authoring mode whose source is the Main source: html_content
            and plain_text_content are its render.'
          enum:
          - jsx
          - visual
          - html
          type: string
        plain_text_content:
          description: The Main source rendered as plain text.
          type: string
        subject:
          type: string
        visual_source:
          description: 'The Visual source, the block editor''s document: a JSON object.
            Left out or null: kept as it is.'
          type: object
      required:
      - html_content
      - main_mode
      - plain_text_content
      - subject
      type: object
    requests.SendSingleMail:
      properties:
        body_variables:
          additionalProperties: {}
          type: object
        recipient_email:
          type: string
        recipient_full_name:
          type: string
        template_id:
          type: string
        template_key:
          type: string
      required:
      - recipient_email
      type: object
    requests.UpdateMailingList:
      properties:
        name:
          type: string
      required:
      - name
      type: object
    requests.UpdateTemplate:
      properties:
        html_content:
          type: string
        key:
          type: string
        name:
          type: string
        plain_text_content:
          type: string
        react_email_content:
          type: string
        subject:
          type: string
      required:
      - html_content
      - name
      - plain_text_content
      - react_email_content
      - subject
      type: object
    requests.UpsertTemplateByKey:
      properties:
        html_content:
          type: string
        name:
          type: string
        plain_text_content:
          type: string
        react_email_content:
          type: string
        subject:
          type: string
        system:
          type: boolean
      required:
      - html_content
      - name
      - plain_text_content
      - react_email_content
      - subject
      type: object
externalDocs:
  description: ""
  url: ""
info:
  contact:
    email: hello@enesgenc.dev
    name: Enes Genç
    url: https://enesgenc.dev
  description: This is the API documentation for Skymail.
  title: Skymail
  version: "1.0"
openapi: 3.1.0
paths:
  /mail_tasks:
    get:
      description: Get a list of all mail tasks with pagination, newest first, each
        with its derived status, recipients by status and audience. The status filter
        keeps only sends with that derived status; X-Total-Count counts the filtered
        sends. Keycloak group names are looked up within 2 seconds for the whole page
        and are null past that.
      parameters:
      - description: Start index
        in: query
        name: _start
        schema:
          type: integer
      - description: End index
        in: query
        name: _end
        schema:
          type: integer
      - description: 'Derived send status: failed (a recipient failed, or none was
          queued a minute after the send), sending (none failed and some pending or
          processing, or none queued yet within that minute), sent (none failed or
          queued, some sent)'
        in: query
        name: status
        schema:
          enum:
          - failed
          - sending
          - sent
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/handlers.MailTaskItem'
                type: array
          description: OK
          headers:
            X-Total-Count:
              description: Number of sends matching the filter
              schema:
                type: integer
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apperrors.AppError'
          description: Bad Request
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apperrors.AppError'
          description: Forbidden
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apperrors.AppError'
          description: Internal Server Error
      summary: List all mail tasks
      tags:
      - Mail
    post:
      description: Create a new mail task and queue emails for all recipients. Supports
        both internal mailing lists and Keycloak groups.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/requests.CreateMailTask'
                description: Mail task details
                summary: task
        description: Mail task details
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                type: object
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apperrors.AppError'
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apperrors.AppError'
          description: Internal Server Error
      summary: Create a new mail task
      tags:
      - Mail
  /mail_tasks/{id}:
    get:
      description: Get details of a specific mail task by its ID, with its derived
        status, recipients by status and audience, as the send list shows it.
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.MailTaskItem'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apperrors.AppError'
          description: Bad Request
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apperrors.AppError'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apperrors.AppError'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apperrors.AppError'
          description: Internal Server Error
      summary: Get a mail task by ID
      tags:
      - Mail
  /mail_tasks/{id}/queue:
    get:
      description: Get a send's recipients, one queue row each, newest first with
        the row id breaking ties so pages neither repeat nor skip a recipient. The
        status filter keeps only recipients in that queue status; X-Total-Count counts
        the filtered recipients.
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: Start index
        in: query
        name: _start
        schema:
          type: integer
      - description: End index
        in: query
        name: _end
        schema:
          type: integer
      - description: Recipient queue status
        in: query
        name: status
        schema:
          enum:
          - pending
          - processing
          - sent
          - failed
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/database.GetMailQueueItemsByTaskIdRow'
                type: array
          description: OK
          headers:
            X-Total-Count:
              description: Number of recipients matching the filter
              schema:
                type: integer
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apperrors.AppError'
          description: Bad Request
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apperrors.AppError'
          description: Forbidden
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apperrors.AppError'
          description: Internal Server Error
      summary: Get mail queue items for a task
      tags:
      - Mail
  /mail_tasks/single:
    post:
      description: Send a single email to a specific recipient using a template.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/requests.SendSingleMail'
                description: Mail details
                summary: mail
        description: Mail details
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                type: object
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apperrors.AppError'
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apperrors.AppError'
          description: Internal Server Error
      summary: Send a single email
      tags:
      - Mail
  /mail_tasks/summary:
    get:
      description: 'Queue rows (one per recipient) by status; sends by derived status,
        each equal to the X-Total-Count of the send list filtered by it; mail sent
        per Europe/Istanbul day over the last days (zero-filled, oldest first, ending
        today); and the latest sends. Derived status: failed (a recipient failed,
        or none was queued a minute after the send), sending (none failed and some
        pending or processing, or none queued yet within that minute), sent (none
        failed or queued, some sent).'
      parameters:
      - description: Days in the daily series, ending today in Europe/Istanbul (1-90)
        in: query
        name: days
        schema:
          default: 30
          type: integer
      - description: Latest sends to list, newest first (1-20)
        in: query
        name: recent
        schema:
          default: 5
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.SendSummary'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apperrors.AppError'
          description: Bad Request
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apperrors.AppError'
          description: Forbidden
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apperrors.AppError'
          description: Internal Server Error
      summary: Summarise mail sends
      tags:
      - Mail
  /mailing_lists:
    get:
      description: Get a list of all mailing lists (internal + Keycloak groups) with
        pagination.
      parameters:
      - description: Start index
        in: query
        name: _start
        schema:
          type: integer
      - description: End index
        in: query
        name: _end
        schema:
          type: integer
      - description: 'Lifecycle filter: current, inactive, all'
        in: query
        name: lifecycle
        schema:
          default: current
          enum:
          - current
          - inactive
          - all
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/handlers.MailingListItem'
                type: array
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apperrors.AppError'
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apperrors.AppError'
          description: Internal Server Error
      summary: List all mailing lists
      tags:
      - Lists
    post:
      description: Create a new mailing list with the provided name.
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/requests.CreateMailingList'
                description: List details
                summary: list
        description: List details
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/database.MailingList'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apperrors.AppError'
          description: Bad Request
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apperrors.AppError'
          description: Internal Server Error
      summary: Create a new mailing list
      tags:
      - Lists
  /mailing_lists/{id}:
    delete:
      description: Archive a mailing list without removing recipients or historical
        mail tasks. Repeating the request is safe.
      parameters:
      - description: List ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apperrors.AppError'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apperrors.AppError'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apperrors.AppError'
          description: Internal Server Error
      summary: Archive a mailing list
      tags:
      - Lists
    get:
      description: Get details of a specific mailing list by its ID. Falls back to
        Keycloak groups.
      parameters:
      - description: List ID
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.MailingListItem'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apperrors.AppError'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apperrors.AppError'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apperrors.AppError'
          description: Internal Server Error
      summary: Get a mailing list by ID
      tags:
      - Lists
    patch:
      description: Update an existing mailing list with the provided ID and details.
      parameters:
      - description: List ID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/requests.UpdateMailingList'
                description: List details
                summary: list
        description: List details
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/database.MailingList'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apperrors.AppError'
          description: Bad Request
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apperrors.AppError'
          description: Not Found
        "500":
