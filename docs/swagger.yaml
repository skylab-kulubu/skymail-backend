  /templates/{id}/versions:
    get:
      description: 'A Mail template''s version history, newest first: who wrote each
        version (an operator, by the name their token carried, or a Template seed),
        when, whether it is published or a draft (published_at null), which Authoring
        mode is its Main source, the published version it started from, and which
        version the template sends (current). Sources and render are left out; read
        one version for them. An archived template''s history stays readable.'
      parameters:
      - description: Template ID
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: Start index
        in: query
        name: _start
        schema:
          type: integer
      - description: End index
        in: query
        name: _end
        schema:
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/handlers.TemplateVersionSummary'
                type: array
          description: OK
          headers:
            X-Total-Count:
              description: Number of versions the template has
              schema:
                type: integer
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apperrors.AppError'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apperrors.AppError'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apperrors.AppError'
          description: Internal Server Error
      summary: List a template's versions
      tags:
      - Templates
  /templates/{id}/versions/{versionId}:
    get:
      description: 'One Mail template version whole: its sources (at most one per
        Authoring mode, null where it has none), which is the Main source, and the
        Main source''s render as HTML and plain text. A version of another template
        is not found.'
      parameters:
      - description: Template ID
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: Version ID
        in: path
        name: versionId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.TemplateVersion'
          description: OK
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apperrors.AppError'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apperrors.AppError'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apperrors.AppError'
          description: Internal Server Error
      summary: Read one version of a template
      tags:
      - Templates
  /templates/{id}/versions/{versionId}/publish:
    post:
      description: |-
        Makes a draft the version the template sends: the draft is marked published and copied onto the template row — subject, HTML and plain text, and react_email_content: the JSX source when JSX is the Main source, an empty string otherwise, so the old panel never re-renders a JSX source that is not what is sent — in one transaction. Answers with the template as publishing left it. Publishing the version the template already sends changes nothing and answers the same way.

        A draft is stale when its base_version_id is not the template's published_version_id: someone published after it was started, and publishing it would quietly revert their version. That is refused with 409 template.stale_base, whose params name version_id (the draft), base_version_id (what it started from) and published_version_id (what is sent now), so both can be shown side by side. {"force": true} publishes it anyway; the replaced version stays in the history.
      parameters:
      - description: Template ID
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: Version ID of the draft
        in: path
        name: versionId
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/requests.PublishTemplateVersion'
                description: Whether to publish over a newer version
                summary: publish
        description: Whether to publish over a newer version
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.Template'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apperrors.AppError'
          description: validation.error or template.invalid_body
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apperrors.AppError'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apperrors.AppError'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apperrors.AppError'
          description: template.stale_base, template.not_a_draft or template.archived
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apperrors.AppError'
          description: Internal Server Error
      summary: Publish a draft
      tags:
      - Templates
  /templates/{id}/versions/{versionId}/restore:
    post:
      description: Copies any version of the template — its subject, sources, Main
        source and render — into a new draft by the caller, started from the version
        published now. Nothing that is sent changes; the draft is published like any
        other. Another operator's draft can be restored too. When the copy would repeat
        the caller's draft in progress, or with none the published version, nothing
        is recorded and that version is answered with 200.
      parameters:
      - description: Template ID
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: Version ID
        in: path
        name: versionId
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.TemplateVersion'
          description: 'Nothing changed: the version the copy would have repeated'
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.TemplateVersion'
          description: The draft, written
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apperrors.AppError'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apperrors.AppError'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apperrors.AppError'
          description: template.archived
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apperrors.AppError'
          description: Internal Server Error
      summary: Restore a version as a draft
      tags:
      - Templates
  /templates/by-key/{key}:
