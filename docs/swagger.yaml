  /templates/{id}/drafts:
    post:
      description: |-
        Records an operator's draft of a Mail template: a version that is sent to nobody until it is published. The template row, which is what is sent, does not change. Changing which source is the Main source is a save too: send the new main_mode and the render its source gives.

        The editor renders the Main source; the server stores the render it is given. It checks what it can without rendering: the fields are there and not blank, the Main source's Authoring mode holds a source, the base is a published version of this template, a Visual source is a JSON object, a JSX source has code in it, and — as every write of a version is checked, by requiredvars — the subject, plain text and HTML parse as the mailer's Go templates (422 template.unparseable, params.part naming subject, plain_text or html) and the HTML references every Required variable of the template as it stands now (422 template.required_variables_missing, params.missing: [{name, source, reason}]). An archived template is not found.

        Each save is a new version; an operator's newest version, while unpublished, is their draft in progress. A save continues it when it started from the same base, or else starts from the base. Sources left out, or null, are kept from the version the save continues, so a save never drops a source; so is the name, and a name sent renames the template when the draft is published. A save that changes nothing records nothing and answers 200 with the version it continues.
      parameters:
      - description: Template ID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/requests.SaveTemplateDraft'
                description: The draft
                summary: draft
        description: The draft
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.TemplateVersion'
          description: 'Nothing changed: the version the save would have repeated'
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.TemplateVersion'
          description: The draft, written
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apperrors.AppError'
          description: validation.error (params.errors, sorted by field), template.invalid_base
            or template.main_source_missing
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apperrors.AppError'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apperrors.AppError'
          description: 'Not Found: no such template, or it is archived'
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apperrors.AppError'
          description: 'template.unparseable: params.part (subject, plain_text or
            html) does not parse, params.error is the parser''s message; or template.required_variables_missing:
            params.missing names each Required variable the HTML drops, with its source
            (contract or operator) and reason'
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apperrors.AppError'
          description: Internal Server Error
      summary: Save a draft of a template
      tags:
      - Templates
  /templates/{id}/required-variables:
    post:
      description: 'Adds a variable to the template''s operator Required variables:
        from then on every save and publish must keep referencing it. The published
        body must reference it already — a Required variable is a promise about the
        mail being sent — counted as the save check counts (inside a conditional section
        counts; a comment, plain text, a range or with element''s field, or index
        . do not). A variable the contract set holds is required already and stays
        the contract''s; asking for one, or for one operators marked, changes nothing.
        Changes no version.'
      parameters:
      - description: Template ID
        in: path
        name: id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - type: object
              - $ref: '#/components/schemas/requests.AddRequiredVariable'
                description: The variable to require
                summary: variable
        description: The variable to require
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/handlers.Template'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apperrors.AppError'
          description: The name is not a variable name (validation.error)
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apperrors.AppError'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apperrors.AppError'
          description: 'No such template in use: unknown or archived'
        "422":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apperrors.AppError'
          description: The published body does not reference the variable (template.required_variables_missing)
            or does not parse (template.unparseable, params.part "html")
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apperrors.AppError'
          description: Internal Server Error
      summary: Mark a variable of a template required
      tags:
      - Templates
