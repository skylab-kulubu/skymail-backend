name: Release

on:
  push:
    branches: [main, production]
    tags: ["v*.*.*"]
  release:
    types: [published]

jobs:
  build-and-push-docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=production,enable=${{ github.ref == 'refs/heads/production' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notify Dokploy
        if: github.ref == 'refs/heads/production'
        continue-on-error: true
        env:
          HOOK: ${{ secrets.DOKPLOY_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "DOKPLOY_DEPLOY_HOOK unset; skip"
            exit 0
          fi
          code=$(curl -sS -o /tmp/hook.out -w '%{http_code}' -A 'DokployDeployHook/1.0' -X POST "$HOOK")
          echo "hook HTTP $code"
          test "$code" -ge 200 && test "$code" -lt 300
